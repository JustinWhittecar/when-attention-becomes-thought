[book]
authors = ["Justin Dielmann"]
language = "en"
multilingual = false
src = "src"
title = "When Attention Becomes Thought"
description = "A book tracing the project of formalizing thought, from Boole's 1854 algebra of logic to the 2026 Nature commentary on AGI. Written for readers who want to evaluate claims for themselves."

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
no-section-label = false
mathjax-support = true
# Update the two URLs below once the repo is pushed to GitHub.
git-repository-url = "https://github.com/JustinWhittecar/when-attention-becomes-thought"
edit-url-template = "https://github.com/JustinWhittecar/when-attention-becomes-thought/edit/main/{path}"

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3

[output.html.print]
enable = true

[output.html.fold]
enable = false
level = 0

[preprocessor.citeproc]
command = "python3 tools/mdbook-citeproc.py"
